<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>아이디/비밀번호 찾기</title>
    <link rel="stylesheet" href="/css/style.css">
    <link rel="stylesheet" href="/css/dialog.css">
</head>
<body class="form-page">
    <header class="form-header">
        <button type="button" onclick="window.location.href='/views/login.html'">로그인으로 돌아가기</button>
    </header>
    <h1>아이디/비밀번호 찾기</h1>
    <form id="find-credentials-form">
        <label for="email">가입 시 사용한 이메일을 입력하세요:</label>
        <input type="email" id="email" placeholder="Email" required>
        <button type="submit">임시 비밀번호 발급</button>
    </form>

    <!-- Global Dialog Structure -->
    <div id="global-dialog-overlay" class="dialog-overlay">
        <div class="dialog-content">
            <h2 id="global-dialog-title"></h2>
            <p id="global-dialog-message"></p>
            <input type="text" id="global-dialog-input" class="dialog-input" style="display: none;">
            <div class="dialog-buttons">
                <button id="global-dialog-confirm-btn" class="btn-primary">확인</button>
                <button id="global-dialog-cancel-btn" class="btn-secondary">취소</button>
            </div>
        </div>
    </div>

    <script type="module" src="/js/find-credentials.js"></script>
</body>
</html>
