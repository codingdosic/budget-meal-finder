<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login</title>
    <link rel="stylesheet" href="/css/style.css">
    <link rel="stylesheet" href="/css/dialog.css">
    <style>
        .admin-register-link {
            display: block;
            text-align: center;
            margin-top: 15px;
            font-size: 14px;
            color: #555;
            text-decoration: none;
        }
        .admin-register-link:hover {
            text-decoration: underline;
        }
    </style>
</head>
<body class="form-page">

    <header class="form-header"></header>

    <h1>Login</h1>
    
    <form id="login-form">
        <input type="email" id="email" placeholder="Email" required>
        <input type="password" id="password" placeholder="Password" required>
        <button type="submit">Login</button>
        <button type="button" id="register-btn">Register</button>
        <button type="button" id="find-credentials-btn">아이디/비밀번호 찾기</button>
        <a href="/views/register-admin.html" class="admin-register-link">관리자 계정 생성</a>
    </form>

    <!-- Global Dialog Structure -->
    <div id="global-dialog-overlay" class="dialog-overlay">
        <div class="dialog-content">
            <h2 id="global-dialog-title"></h2>
            <p id="global-dialog-message"></p>
            <input type="text" id="global-dialog-input" class="dialog-input" style="display: none;">
            <div class="dialog-buttons">
                <button id="global-dialog-confirm-btn" class="btn-primary">확인</button>
                <button id="global-dialog-cancel-btn" class="btn-secondary">취소</button>
            </div>
        </div>
    </div>

    <script type="module" src="/js/login.js"></script>
</body>
</html>
