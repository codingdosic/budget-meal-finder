<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Register</title>
    <link rel="stylesheet" href="/css/style.css">
    <link rel="stylesheet" href="/css/dialog.css">
</head>
<body class="form-page">
    <header class="form-header">
        <button type="button" id="back-to-login-btn" onclick="window.location.href='/views/login.html'">로그인으로 돌아가기</button>
    </header>
    <h1>Register</h1>
    <form id="register-form">
        <input type="text" id="username" placeholder="Username" required>
        <input type="email" id="email" placeholder="Email" required>
        <input type="password" id="password" placeholder="Password" required>
        <p class="hint-text">비밀번호는 6자 이상이어야 합니다.</p>
        <button type="submit">Register</button>
    </form>

    <!-- Global Dialog Structure -->
    <div id="global-dialog-overlay" class="dialog-overlay">
        <div class="dialog-content">
            <h2 id="global-dialog-title"></h2>
            <p id="global-dialog-message"></p>
            <input type="text" id="global-dialog-input" class="dialog-input" style="display: none;">
            <div class="dialog-buttons">
                <button id="global-dialog-confirm-btn" class="btn-primary">확인</button>
                <button id="global-dialog-cancel-btn" class="btn-secondary">취소</button>
            </div>
        </div>
    </div>

    <script type="module" src="/js/register-admin.js"></script>
</body>
</html>
