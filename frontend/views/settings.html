<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>사용자 설정 - Budget Meal Finder</title>
    <link rel="stylesheet" href="/css/style.css">
    <link rel="stylesheet" href="/css/settings.css">
    <link rel="stylesheet" href="/css/dialog.css">
</head>
<body>

    <header>
        <h1><a href="/">Budget Meal Finder</a></h1>
        <div class="header-buttons">
            <button id="back-to-map-btn">지도로 돌아가기</button>
        </div>
    </header>

    <main class="settings-container">

        <section id="account-management">
            <h3>계정 관리</h3>
            <div class="account-main-content">
                <div class="form-group">
                    <label for="username">사용자 이름</label>
                    <input type="text" id="username" disabled>
                </div>
                <div id="account-actions-container">
                    <div class="form-group">
                        <label for="email">이메일 주소</label>
                        <input type="email" id="email" disabled>
                        <button id="edit-email-btn">변경</button>
                    </div>
                    <div>
                        <div class="form-group">
                            <label for="current-password">현재 비밀번호</label>
                            <input type="password" id="current-password">
                        </div>
                        <div class="form-group">
                            <label for="new-password">새 비밀번호</label>
                            <input type="password" id="new-password">
                        </div>
                        <div class="form-group">
                            <label for="confirm-password">새 비밀번호 확인</label>
                            <input type="password" id="confirm-password">
                        </div>
                        <button id="change-password-btn" class="btn-primary">비밀번호 변경</button>
                    </div>
                </div>
            </div>
            <div class="account-footer-actions">
                <hr>
                <button id="delete-account-btn" class="btn-danger">계정 삭제</button>
            </div>
        </section>

        <section id="my-content">
            <h3 id="menu-display-title">내가 등록한 메뉴</h3>
            <div id="my-menus-list"></div>
        </section>

        <div class="admin-content-wrapper">
            <section id="admin-panel" style="display: none;">
                <h3>사용자 관리</h3>
                <div class="form-group">
                    <input type="text" id="user-search-input" placeholder="사용자 이름 또는 이메일로 검색">
                    <button id="user-search-btn" class="btn-primary">검색</button>
                </div>
                <div id="user-list"></div>
            </section>

            <section id="selected-user-content" style="display: none;">
                <h3 id="selected-user-menu-title">선택된 사용자의 메뉴</h3>
                <div id="selected-user-menus-list"></div>
            </section>
        </div>

        

    </main>

    <!-- Global Dialog Structure -->
    <div id="global-dialog-overlay" class="dialog-overlay">
        <div class="dialog-content">
            <h2 id="global-dialog-title"></h2>
            <p id="global-dialog-message"></p>
            <input type="text" id="global-dialog-input" class="dialog-input" style="display: none;">
            <div class="dialog-buttons">
                <button id="global-dialog-confirm-btn" class="btn-primary">확인</button>
                <button id="global-dialog-cancel-btn" class="btn-secondary">취소</button>
            </div>
        </div>
    </div>

    <script type="module" src="/js/settings.js"></script>
</body>
</html>
